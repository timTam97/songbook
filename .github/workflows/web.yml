# Rebuilds the web app and the PDF from melbourne-songs.tex and deploys them.
#  - Pull requests: parse, test, compile the PDF and build only (bad LaTeX
#    fails with file:line). The PDF is attached to the run as an artifact.
#  - Pushes to master: the same, then deploy to AWS through GitHub OIDC.
name: Web app

on:
  push:
    branches: [master]
    paths:
      - melbourne-songs.tex
      - melbourne-songs.pdf
      - songbook.sty
      - songbook.ist
      - conditionals.sty
      - web/**
      - infra/**
      - package.json
      - package-lock.json
      - .github/workflows/web.yml
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Never run two deploys at once; a newer push waits for the current one.
concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write # OIDC token for AWS; the role only trusts master
    env:
      DEPLOY: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/master' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history: the PDF's date comes from the last .tex commit

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Parse songbook
        run: npm run parse

      - run: npm run typecheck
      - run: npm test

      - name: Install TeX Live
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base texlive-latex-recommended texlive-fonts-recommended

      # Overwrites the committed melbourne-songs.pdf in the workspace, so the
      # web build below publishes the PDF compiled from this exact .tex.
      - name: Build PDF
        run: |
          # The title page's "Last Revised" is \today. Pin it to the last commit
          # that changed the songbook, in Melbourne time, so the date neither
          # moves on web-only deploys nor follows the runner's UTC clock.
          read -r day month year < <(TZ=Australia/Melbourne \
            git log -1 --format=%cd --date=format-local:'%d %m %Y' -- melbourne-songs.tex)
          # Same moment for the PDF's metadata, so rebuilds are byte-identical.
          export SOURCE_DATE_EPOCH=$(git log -1 --format=%ct -- melbourne-songs.tex)
          run_pdflatex() {
            pdflatex -interaction=nonstopmode -halt-on-error -jobname=melbourne-songs \
              "\day=$day \month=$month \year=$year \input{melbourne-songs.tex}"
          }
          touch melbourne-songs.tdx # pass 1 \input's the index before makeindex writes it
          run_pdflatex
          makeindex -s songbook.ist -o melbourne-songs.tdx melbourne-songs.tIdx
          run_pdflatex
          run_pdflatex # hyperref needs one more pass for its link targets

      - name: Upload PDF
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: melbourne-songs-pdf
          path: melbourne-songs.pdf
          if-no-files-found: error

      - run: npm run build
      - name: Synth (checks only; the real domain is added at deploy)
        run: npm run synth
        env:
          SITE_NO_DOMAIN: 'true'

      - name: Configure AWS credentials
        if: env.DEPLOY == 'true'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'ap-southeast-2' }}

      - name: Deploy
        if: env.DEPLOY == 'true'
        working-directory: infra
        # Secrets (not variables) so the domain is masked in the public logs.
        # If either is missing the CDK app refuses to deploy rather than detach the domain.
        env:
          SITE_DOMAIN_NAME: ${{ secrets.SITE_DOMAIN_NAME }}
          SITE_CERTIFICATE_ARN: ${{ secrets.SITE_CERTIFICATE_ARN }}
        # Only the site. The deploy role's own stack is changed by hand, never by CI.
        run: npx cdk deploy MelbourneSongsSite --require-approval never --outputs-file cdk-outputs.json

      - name: Summary
        if: env.DEPLOY == 'true'
        run: |
          url=$(node -p "require('./infra/cdk-outputs.json').MelbourneSongsSite.SiteUrl")
          echo "Deployed. CloudFront address: $url" >> "$GITHUB_STEP_SUMMARY"
